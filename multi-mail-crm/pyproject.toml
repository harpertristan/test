[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-mail-crm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "setuptools==84.2.1",
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.16.2",
  "SQLAlchemy[asyncio]==2.0.38",
  "asyncpg==0.30.0",
  "alembic==1.14.1",
  "celery[redis]==5.4.0",
  "kombu==5.4.2",
  "redis==5.2.1",
  "cryptography==50.0.2",
  "PyJWT==2.15.1",
  "pwdlib[argon2]==0.2.1",
  "email-validator==2.2.0",
  "httpx==0.28.1",
  "openai==1.63.2",
  "aiogram==3.31.0",
  "aiohttp==3.14.5",
  "starlette==1.10.0",
  "imap-tools==1.9.1",
  "aiosmtplib==5.1.3",
  "prometheus-client==0.21.1",
  "structlog==25.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "respx==0.22.0", "ruff==0.9.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
