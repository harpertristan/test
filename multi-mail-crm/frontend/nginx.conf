log_format safe '$remote_addr "$request_method $uri" $status $body_bytes_sent';
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout safe;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /mail-crm { return 308 /mail-crm/; }
    location /mail-crm/ { rewrite ^/mail-crm/(.*)$ /$1 last; }
    location = /api/metrics { return 404; }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /ws/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
