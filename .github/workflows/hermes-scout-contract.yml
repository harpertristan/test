name: Hermes Scout task contract
on:
  push:
    branches: [test-hermes-scout-flow-20261108]
  pull_request:
    paths:
      - "agent-stack/task_capability.py"
      - "agent-stack/task_runtime_context.py"
      - "agent-stack/hermes_gateway_bridge.py"
      - "agent-stack/tests/test_task_read_gate.py"
      - "agent-stack/tests/test_scoped_mcp_contract.py"
      - "agent-stack/ops/hermes_safe_deploy.sh"
      - "agent-stack/ops/scout_start_preflight.sh"
      - "agent-stack/ops/install_scout_start.sh"
      - "agent-stack/ops/enable_hermes_three_service_reads.sh"
      - "agent-stack/ops/diagnose_hermes_run.sh"
      - "agent-stack/ops/hermes_unified_repair.sh"
      - "agent-stack/ops/enable_paperclip_scheduler.sh"
      - "agent-stack/scout_start_policy.mjs"
      - "agent-stack/scout_start_gateway.mjs"
      - "agent-stack/task_control_mcp.py"
      - "agent-stack/serve_hermes.py"
      - "agent-stack/compose.scout-start.yaml"
      - "agent-stack/tests/scout_start_policy.test.mjs"
      - "agent-stack/task_control_policy.mjs"
      - "agent-stack/three_tool_read_policy.mjs"
      - "agent-stack/three_tool_read_scope.mjs"
      - "agent-stack/three_tool_read_sidecar.mjs"
      - "agent-stack/tests/three_tool_read_sidecar.integration.test.mjs"
      - "agent-stack/tests/scout_gateway.integration.test.mjs"
      - "agent-stack/task_control.mjs"
      - "agent-stack/tests/task_control_policy.test.mjs"
      - "agent-stack/tests/hermes_scout_contract.test.mjs"
      - ".github/workflows/hermes-scout-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate one-command deployment script
        run: |
          bash -n agent-stack/ops/hermes_safe_deploy.sh
          bash -n agent-stack/ops/scout_start_preflight.sh
          bash -n agent-stack/ops/install_scout_start.sh
          bash -n agent-stack/ops/enable_hermes_three_service_reads.sh
          bash -n agent-stack/ops/diagnose_hermes_run.sh
          bash -n agent-stack/ops/hermes_unified_repair.sh
          bash -n agent-stack/ops/enable_paperclip_scheduler.sh
          node --check agent-stack/task_control.mjs
          node --check agent-stack/three_tool_read_sidecar.mjs
          node --check agent-stack/scout_start_gateway.mjs
          node --check agent-stack/three_tool_read_scope.mjs
      - name: Validate embedded Python and simulated permission update
        run: |
          python3 - <<'PY'
          import ast, pathlib, subprocess, tempfile, json
          script=pathlib.Path("agent-stack/ops/enable_hermes_three_service_reads.sh").read_text()
          blocks=script.split("<<'PY'\n")
          assert len(blocks)==3, f"Expected two embedded Python blocks, got {len(blocks)-1}"
          code1=blocks[1].split("\nPY\n",1)[0]
          code2=blocks[2].split("\nPY\n",1)[0]
          ast.parse(code1)
          ast.parse(code2)
          issue="2d95562b-a3f8-465e-bfa9-842dbd950acb"
          with tempfile.TemporaryDirectory() as tmp:
              scope=pathlib.Path(tmp)/"scope.json"
              initial={"version":1,"grants":{issue:{
                "issueIdentifier":"WOR-7",
                "workspaceWide":True,
                "operations":["scout_start","scout_findings"],
                "mailConsent":False
              }}}
              scope.write_text(json.dumps(initial))
              subprocess.run(["python3","-c",code1,str(scope),issue,"WOR-7"],check=True)
              subprocess.run(["python3","-c",code2,str(scope),issue],check=True)
              result=json.loads(scope.read_text())
              ops=set(result["grants"][issue]["operations"])
              assert {"mail_message","mail_messages","mail_tasks","scout_start"}.issubset(ops)
              assert result["grants"][issue]["mailConsent"] is True
              assert not ops.intersection({"mail_send","mail_delete","mail_update"})
              # Wrong task key must fail without mutating the policy.
              before=scope.read_bytes()
              p=subprocess.run(["python3","-c",code1,str(scope),issue,"WRONG-KEY"],capture_output=True)
              assert p.returncode!=0
              assert scope.read_bytes()==before
          print("PASS: embedded Python syntax, scope grant, no send rights, wrong-task denial")
          PY
      - name: Validate unified repair embedded Python with synthetic authorized agent
        run: |
          python3 - <<'PY'
          import ast, pathlib, subprocess, tempfile, json
          script=pathlib.Path("agent-stack/ops/hermes_unified_repair.sh").read_text()
          blocks=script.split("<<'PY'\n")
          assert len(blocks)==3, f"Expected 2 embedded Python blocks, got {len(blocks)-1}"
          prepare=blocks[1].split("\nPY\n",1)[0]
          verify=blocks[2].split("\nPY\n",1)[0]
          ast.parse(prepare)
          ast.parse(verify)
          with tempfile.TemporaryDirectory() as tmp:
            base=pathlib.Path(tmp)
            scope=base/"scope.json"
            identity=base/"identity.json"
            next_scope=base/"next.json"
            mcp=base/"mcp.json"
            issue="2d95562b-a3f8-465e-bfa9-842dbd950acb"
            original={"version":1,"grants":{issue:{
              "issueIdentifier":"WOR-7",
              "operations":["scout_start","scout_findings","mail_message"],
              "workspaceWide":True,"mailConsent":True
            }}}
            scope.write_text(json.dumps(original))
            identity.write_text(json.dumps({"agentId":"synthetic-hermes","companyId":"synthetic-company"}))
            subprocess.run(["python3","-c",prepare,str(scope),str(identity),str(next_scope)],check=True)
            updated=json.loads(next_scope.read_text())
            assert updated["grants"]==original["grants"],"Must not mutate existing issue grants"
            ops=set(updated["agentGrants"]["synthetic-hermes"]["operations"])
            assert "mail_message" in ops and "mail_send" not in ops and "assistant_profile" not in ops
            mcp.write_text(json.dumps({"result":{"tools":[{"name":n} for n in (
              "current_task","submit_result","scout_start","scout_read","assistant_read","mail_crm_read"
            )]}}))
            subprocess.run(["python3","-c",verify,str(mcp),str(next_scope),str(identity)],check=True)
          print("PASS: unified installer embedded Python execution and identity-bound grants")
          PY
      - name: Execute Paperclip scheduler patch against isolated compose fixture
        run: |
          python3 - <<'PY'
          import ast,pathlib,tempfile,subprocess
          script=pathlib.Path("agent-stack/ops/enable_paperclip_scheduler.sh").read_text()
          code=script.split("<<'PY'\n",1)[1].split("\nPY\n",1)[0]
          ast.parse(code)
          with tempfile.TemporaryDirectory() as tmp:
            original=pathlib.Path("agent-stack/compose.paperclip.yaml").read_text()
            source=pathlib.Path(tmp)/"compose.yaml"
            dest=pathlib.Path(tmp)/"compose.next.yaml"
            source.write_text(original)
            subprocess.run(["python3","-c",code,str(source),str(dest)],check=True)
            modified=dest.read_text()
            assert modified.count("HEARTBEAT_SCHEDULER_ENABLED: 'true'")==1
            assert modified.count("HEARTBEAT_SCHEDULER_INTERVAL_MS: '60000'")==1
            assert "HEARTBEAT_SCHEDULER_ENABLED: 'false'" not in modified
            assert original.replace("      HEARTBEAT_SCHEDULER_ENABLED: 'false'","      HEARTBEAT_SCHEDULER_ENABLED: 'true'\n      HEARTBEAT_SCHEDULER_INTERVAL_MS: '60000'")==modified
            denied=subprocess.run(["python3","-c",code,str(dest),str(source)],capture_output=True)
            assert denied.returncode!=0,"Installer must not override already enabled scheduler"
          print("PASS: one precise scheduler change, rerun denied")
          PY
      - name: Compile all Python entrypoints
        run: |
          python3 -m py_compile agent-stack/hermes_gateway_bridge.py agent-stack/task_runtime_context.py agent-stack/task_control_mcp.py agent-stack/serve_hermes.py
      - name: Cross-language task authorization and read scope
        working-directory: agent-stack
        run: |
          node --test tests/task_control_policy.test.mjs tests/three_tool_read_scope.test.mjs tests/three_tool_read_sidecar.integration.test.mjs tests/scout_gateway.integration.test.mjs tests/hermes_scout_contract.test.mjs tests/scout_start_policy.test.mjs
          python3 -m unittest discover -s tests -p 'test_*mcp_contract.py' -v
          python3 -m unittest discover -s tests -p test_task_read_gate.py -v
