name: Hermes integrated operator verified build
on:
  push:
    branches: [hermes-integrated-operator-20261108]
  pull_request:
    paths:
      - "agent-stack/**"
      - ".github/workflows/hermes-integrated-operator.yml"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax verification for production entrypoints
        run: |
          set -Eeuo pipefail
          node --check agent-stack/task_control_policy.mjs
          node --check agent-stack/task_control.mjs
          node --check agent-stack/scout_start_gateway.mjs
          node --check agent-stack/scout_web_policy.mjs
          node --check agent-stack/scout_web_fetch.mjs
          node --check agent-stack/ops/diagnose_paperclip_skip.mjs
          node --check agent-stack/ops/continue_wor7_safe.mjs
          python3 -m py_compile agent-stack/task_control_mcp.py agent-stack/task_runtime_context.py agent-stack/serve_hermes.py agent-stack/hermes_gateway_bridge.py agent-stack/developer_engine.py agent-stack/skills_memory.py
      - name: Validate one-command installer with real synthetic scope and config
        run: |
          set -Eeuo pipefail
          bash -n agent-stack/ops/install_integrated_hermes.sh
          bash -n agent-stack/ops/install_public_search_fix.sh
          python3 - <<'PY'
          import ast,json,pathlib,re,subprocess,tempfile
          script=pathlib.Path("agent-stack/ops/install_integrated_hermes.sh").read_text()
          blocks=re.findall(r"<<'PY'\n(.*?)\nPY",script,re.S)
          assert len(blocks)==2,len(blocks)
          for code in blocks:ast.parse(code)
          with tempfile.TemporaryDirectory() as tmp:
            root=pathlib.Path(tmp)
            sid="2d95562b-a3f8-465e-bfa9-842dbd950acb"
            scope=root/"scope.json"
            identity=root/"identity.json"
            config=root/"hermes.yaml"
            scope.write_text(json.dumps({"version":1,"grants":{sid:{
              "issueIdentifier":"WOR-7","workspaceWide":True,
              "operations":["scout_start","scout_findings"],"scoutSourceIds":["social:ecb"]}},
              "agentGrants":{"hermes-test":{"agentId":"hermes-test","companyId":"company-test",
                "workspaceWide":True,"mailConsent":True,"companyIds":[],
                "operations":["mail_messages","mail_message","scout_findings"]}}}))
            identity.write_text(json.dumps({"agentId":"hermes-test","companyId":"company-test"}))
            config.write_text("mcp_servers:\n  paperclip_task:\n    tools:\n      include: [current_task, submit_result, scout_start, scout_read, assistant_read, mail_crm_read]\n")
            subprocess.run(["python3","-c",blocks[0],str(scope),str(identity),str(config),str(root),sid],check=True)
            result=json.loads((root/"scope.next").read_text())
            assert result["grants"][sid]["scoutSourceIds"]==["social:ecb"]
            assert "scout_start" in result["grants"][sid]["operations"]
            assert "scout_web" in result["grants"][sid]["operations"]
            assert "scout_web" in result["agentGrants"]["hermes-test"]["operations"]
            assert "mail_send" not in result["agentGrants"]["hermes-test"]["operations"]
            config_text=(root/"config.next").read_text()
            assert "developer_status" in config_text and "skills_memory" in config_text
            assert "request_approval" in config_text and "web_research" in config_text
            assert "mail_send" not in config_text
            tools=["current_task","begin_task","submit_result","request_approval","web_research",
             "skills_memory","developer_status","scout_start","scout_read","assistant_read","mail_crm_read"]
            mcp=root/"mcp.json"
            mcp.write_text(json.dumps({"result":{"tools":[{"name":x} for x in tools]}}))
            subprocess.run(["python3","-c",blocks[1],str(mcp)],check=True)
          print("PASS: installer syntax, embedded scripts, grant preservation and 11-tool manifest")
          PY
      - name: Native task binding and web safety policies
        working-directory: agent-stack
        run: |
          set -Eeuo pipefail
          node --test tests/task_control_policy.test.mjs tests/hermes_scout_contract.test.mjs tests/scout_start_policy.test.mjs tests/three_tool_read_scope.test.mjs tests/scout_web_policy.test.mjs tests/scout_web_fetch.test.mjs tests/paperclip_wakeup_diagnostic.test.mjs tests/continue_wor7_safe.test.mjs
      - name: Live HTTPS through production Scout DNS pin
        working-directory: agent-stack
        run: |
          node --input-type=module <<'JS'
          import {publicOpen} from "./scout_web_fetch.mjs";
          const sites=["https://example.com/","https://www.google.com/","https://github.com/"];
          let ok=false;
          for(const url of sites){
            try {
              const page=await publicOpen(url);
              if(page.status===200&&page.text.length>10){
                console.log("PASS: live public HTTPS via pinned DNS",new URL(page.sourceUrl).hostname);
                ok=true;break;
              }
            }catch(error){
              console.log("HTTPS probe:",new URL(url).hostname,error.message);
            }
          }
          if(!ok)process.exit(1);
          JS
      - name: Real public banking search smoke
        working-directory: agent-stack
        run: |
          node --input-type=module <<'JS'
          import {publicSearch,publicOpen} from "./scout_web_fetch.mjs";
          const query="UK business account EMI company FCA";
          const result=await publicSearch(query);
          if(!result.results.length){
            for(const url of [
              "https://www.google.com/search?q="+encodeURIComponent(query),
              "https://www.bing.com/search?q="+encodeURIComponent(query),
              "https://html.duckduckgo.com/html/?q="+encodeURIComponent(query)
            ]){
              try{
                const page=await publicOpen(url);
                console.log(JSON.stringify({source:new URL(url).hostname,title:page.title,
                  textLength:page.text.length,
                  sample:page.text.slice(0,180),
                  linkCount:page.links.length,
                  linkHosts:page.links.slice(0,10).map(x=>new URL(x).hostname)}));
              }catch(e){console.log("provider probe unavailable",new URL(url).hostname,e.message)}
            }
          }
          console.log(JSON.stringify({
            status:result.code??"ok",
            provider:result.provider??null,
            candidateLinks:result.results.length,
            providerErrors:result.providerErrors??[]
          }));
          if(result.results.length===0)process.exit(1);
          let verified=0;
          for(const url of result.results.slice(0,8)){
            try {
              const page=await publicOpen(url);
              if(page.status===200&&page.text.length>30){
                console.log("LIVE_OFFICIAL_CANDIDATE_PAGE_OPENED",new URL(page.sourceUrl).hostname);
                verified++;break;
              }
            }catch(error){
              console.log("Candidate not readable",new URL(url).hostname,String(error.message).slice(0,60));
            }
          }
          if(verified===0)process.exit(2);
          JS
      - name: Unix gateway integration tests (synthetic local services)
        working-directory: agent-stack
        run: |
          set -Eeuo pipefail
          node --test tests/three_tool_read_sidecar.integration.test.mjs tests/scout_gateway.integration.test.mjs
      - name: MCP, session evidence and Developer Engine
        working-directory: agent-stack
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p "test_*mcp_contract.py" -v
          python3 -m unittest discover -s tests -p "test_task_read_gate.py" -v
          python3 -m unittest discover -s tests -p "test_developer_engine.py" -v
          python3 -m unittest discover -s tests -p "test_skills_memory.py" -v
