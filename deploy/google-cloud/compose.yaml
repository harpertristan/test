name: play-scout
services:
  app:
    image: play-scout:${PLAY_SCOUT_IMAGE_TAG:-local}
    build:
      context: ../..
    user: "1000:1000"
    init: true
    restart: unless-stopped
    command: ["node", "--disallow-code-generation-from-strings", "scripts/start-cloud.js", "${PLAY_SCOUT_MODE---manual}"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /var/lib/play-scout
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - /srv/play-scout/data:/var/lib/play-scout
      - /srv/play-scout/app.env:/app/.env:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const j=await r.json();if(!r.ok||j.status!=='ok'||j.storageError)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 120s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - /srv/play-scout/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["public"]
    environment:
      SCOUT_DOMAIN: ${SCOUT_DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
