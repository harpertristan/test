<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Synthetic company details form</title><style>body{font:14px Arial;max-width:760px;margin:30px;color:#34405b}h2{color:#1498e8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}.field{margin:14px 0}label{display:block;margin:5px 0}input:not([type=checkbox]),select,textarea{box-sizing:border-box;width:100%;padding:10px;background:#f1f4fd;border:1px solid #bbc0cf;border-radius:4px}small{display:block;margin-top:7px;color:#68718c}.pair{display:grid;grid-template-columns:90px 1fr;gap:8px}section{margin-top:20px}button{padding:10px 25px;background:#159ee8;color:white;border:0;margin:15px}</style></head><body>
<form><h2>2. Company details</h2><div class="grid">
<div><div class="field"><label for="company">Company or Trading name *</label><input id="company" name="business_name" required></div><div class="field"><label for="legal">Company legal form *</label><select id="legal"><option value="">Please Select</option><option value="private">Private limited company</option><option value="public">Public limited company</option></select></div><div class="field"><label for="lei">LEI code (optional) This is required to make use of Investment Services</label><input id="lei"><small>This is required to make use of Investment Services</small></div><div class="field"><label for="reg">Company registration number *</label><input id="reg"></div><div class="field"><label for="email">Company email *</label><input id="email" type="email"></div><div class="field"><label for="web">Company website</label><input id="web" type="url"></div></div>
<div><div class="field"><label for="taxCountry">Country of tax residence *</label><select id="taxCountry"><option value="MT" selected>Malta</option><option value="GB">United Kingdom</option></select></div><div class="field"><label for="tax">Tax number *</label><input id="tax"><small>TIN</small></div><div class="field"><label>Phone number *</label><div class="pair"><div><input id="dial"><small>Country code</small></div><div><input id="phone"><small>Phone number</small></div></div></div><div class="field"><label for="date">Date of Registration</label><input id="date" placeholder="MM-DD-YYYY"><small>Date</small></div><div class="field"><label for="vat">VAT number *</label><input id="vat"></div></div></div>
<section><label for="regLine1">Registered address *</label><div class="field"><input id="regLine1"><small>Address line 1</small></div><div class="field"><input id="regLine2"><small>Address line 2</small></div><div class="field"><input id="regCity"><small>Town / city</small></div><div class="grid"><div class="field"><input id="regPost"><small>Postcode</small></div><div class="field"><select id="regCountry"><option value="">Please Select</option><option value="GB">United Kingdom</option><option value="MT">Malta</option></select><small>Country</small></div></div></section>
<div><label>Is the registered address the same as operating address?</label><label><input id="same" type="checkbox">Yes</label></div>
<section><label for="opLine1">Operating address</label><div class="field"><input id="opLine1"><small>Address line 1</small></div><div class="field"><input id="opLine2"><small>Address line 2</small></div><div class="field"><input id="opCity"><small>Town / city</small></div><div class="grid"><div class="field"><input id="opPost"><small>Postcode</small></div><div class="field"><select id="opCountry"><option value="">Please Select</option><option value="GB">United Kingdom</option><option value="MT">Malta</option></select><small>Country</small></div></div></section>
<div class="field"><label for="unusual">Organisation designation for this application</label><input id="unusual" name="designation"></div><button type="submit">Save</button><button type="submit">Next</button></form></body></html>
