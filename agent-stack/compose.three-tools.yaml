# Add alongside compose.yaml, compose.paperclip.yaml,
# compose.hermes-gateway.yaml and compose.task-control.yaml.
services:
  three-tool-read:
    image: workspace-paperclip:7e3caa7
    user: '10000:10000'
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [node, /opt/workspace-agent/three_tool_read_sidecar.mjs]
    volumes:
      - .:/opt/workspace-agent:ro
      - /srv/hermes-stack/task-control:/run/task-control:ro
      - /srv/hermes-stack/three-tools:/run/three-tools
      - /srv/hermes-stack/private/three-tool-scope.json:/run/secrets/three-tool-scope.json:ro
    networks: [three-tool-network]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "require('http').get({socketPath:'/run/three-tools/read.sock',path:'/health'},r=>{r.resume();if(r.statusCode!==200)process.exit(1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  hermes-runtime:
    volumes:
      - /srv/hermes-stack/three-tools:/run/three-tools:ro
    depends_on:
      three-tool-read:
        condition: service_healthy
networks:
  three-tool-network:
    external: true
    name: multi-mail-crm_default
