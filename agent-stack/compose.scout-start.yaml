# Add to existing five Compose files. Hermes remains network_mode:none.
services:
  scout-start-gateway:
    image: workspace-paperclip:7e3caa7
    user: '10000:10000'
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [node, /opt/workspace-agent/scout_start_gateway.mjs]
    volumes:
      - .:/opt/workspace-agent:ro
      - /srv/hermes-stack/task-control:/run/task-control:ro
      - /srv/hermes-stack/three-tools:/run/three-tools
      - /srv/hermes-stack/private/three-tool-scope.json:/run/secrets/three-tool-scope.json:ro
      - /srv/hermes-stack/state/scout-start:/state
    networks: [scout-start-network]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=32m"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "require('http').get({socketPath:'/run/three-tools/start.sock',path:'/health'},r=>{r.resume();if(r.statusCode!==200)process.exit(1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  scout-start-network:
    external: true
    name: play-scout_default
