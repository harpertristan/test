services:
  hermes-runtime:
    image: workspace-hermes:90d6b98
    user: '10000:10000'
    network_mode: none
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [/opt/hermes/.venv/bin/python, /opt/workspace-agent/serve_hermes.py]
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      XDG_CACHE_HOME: /tmp/cache
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - .:/opt/workspace-agent:ro
      - /srv/hermes-stack/state/hermes-gateway:/opt/data
      - /srv/hermes-stack/config/hermes-gateway.yaml:/opt/data/config.yaml:ro
      - /srv/hermes-stack/model-bridge:/run/model-bridge:ro
      - /srv/hermes-stack/hermes-bridge:/run/hermes-bridge
      - /srv/hermes-stack/private/hermes-gateway.key:/run/secrets/hermes-gateway.key:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=256m"]
    mem_limit: 2g
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD, /opt/hermes/.venv/bin/python, /opt/workspace-agent/probe_hermes_gateway.py, --runtime]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 8
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  hermes-paperclip-bridge:
    image: workspace-hermes:90d6b98
    user: '10000:10000'
    network_mode: service:paperclip
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [/opt/hermes/.venv/bin/python, /opt/workspace-agent/hermes_gateway_bridge.py]
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - .:/opt/workspace-agent:ro
      - /srv/hermes-stack/hermes-bridge:/run/hermes-bridge:ro
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    depends_on:
      paperclip:
        condition: service_healthy
      hermes-runtime:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
